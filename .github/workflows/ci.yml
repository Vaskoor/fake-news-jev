name: CI

"on":
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  PIP_NO_CACHE_DIR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONPATH: src
  JEV_PROVIDER: simulated
  SEED: "42"

jobs:
  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dev tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff black
      - name: Ruff check
        run: python -m ruff check src tests scripts
      - name: Black --check
        run: python -m black --check src tests scripts

  test:
    name: Tests (pytest, py ${{ env.PYTHON_VERSION }})
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install runtime deps (tests-only subset)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-cov
      - name: Run offline test suite
        env:
          JEV_PROVIDER: simulated
          PYTHONPATH: src
        run: |
          python -m pytest -q --tb=short \
              --cov=fakenews --cov-report=term-missing tests

  train-smoke:
    name: Train smoke (synthetic, offline)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Train on synthetic dataset (rule-based fallback)
        env:
          JEV_PROVIDER: simulated
          PYTHONPATH: src
          SEED: "42"
        run: |
          python scripts/train.py --dataset synthetic --seed 42

  eval-smoke:
    name: Evaluate smoke (synthetic, offline)
    runs-on: ubuntu-latest
    needs: train-smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Evaluate on synthetic test split
        env:
          JEV_PROVIDER: simulated
          PYTHONPATH: src
          SEED: "42"
        run: |
          python scripts/evaluate.py --dataset synthetic --seed 42
