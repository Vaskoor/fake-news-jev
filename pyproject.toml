# =============================================================================
# pyproject.toml — fake-news-jev
# =============================================================================

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fake-news-jev"
version = "0.1.0"
description = "Production-grade fake-news detection system (3-stage hybrid: Jev signal extraction + LightGBM meta-classifier + evidence check)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Bhaskar Kaphle", email = "kaphlebhaskar012345@gmail.com" },
]
keywords = [
    "fake-news",
    "misinformation",
    "nlp",
    "machine-learning",
    "lightgbm",
    "shap",
    "explainable-ai",
    "fact-checking",
    "calibration",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "numpy>=1.24,<3.0",
    "pandas>=2.0,<3.0",
    "scikit-learn>=1.3,<2.0",
    "scipy>=1.10,<2.0",
    "lightgbm>=4.0,<5.0",
    "xgboost>=2.0,<3.0",
    "joblib>=1.3,<2.0",
    "pyyaml>=6.0,<7.0",
    "requests>=2.31,<3.0",
    "aiohttp>=3.9,<4.0",
    "fastapi>=0.104,<1.0",
    "uvicorn[standard]>=0.24,<1.0",
    "streamlit>=1.28,<2.0",
    "matplotlib>=3.7,<4.0",
    "seaborn>=0.13,<1.0",
    "shap>=0.44,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9.0",
    "pytest-cov>=4.1,<7.0",
    "ruff>=0.1,<1.0",
    "black>=23.0,<25.0",
    "mypy>=1.6,<2.0",
]

[project.urls]
Homepage = "https://github.com/kaphlebhaskar/fake-news-jev"
Repository = "https://github.com/kaphlebhaskar/fake-news-jev"
Documentation = "https://github.com/kaphlebhaskar/fake-news-jev#readme"
"Bug Tracker" = "https://github.com/kaphlebhaskar/fake-news-jev/issues"
Changelog = "https://github.com/kaphlebhaskar/fake-news-jev/releases"

[project.scripts]
fakenews-train = "scripts.train:main"
fakenews-evaluate = "scripts.evaluate:main"

# ---------------------------------------------------------------------------
# setuptools — src layout
# ---------------------------------------------------------------------------
[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["fakenews*"]

[tool.setuptools.package-data]
fakenews = ["*.yaml", "*.yml"]

# ---------------------------------------------------------------------------
# pytest — find tests in tests/, put src/ on PYTHONPATH
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "7.4"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests that require a live Jev API key",
]

# ---------------------------------------------------------------------------
# ruff — pyflakes + pycodestyle + isort
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
    "E501",  # line length is enforced by black; ruff leaves long lines alone
]

[tool.ruff.lint.isort]
known-first-party = ["fakenews"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]   # sys.path manipulation before imports in tests
"scripts/*" = ["E402"]

# ---------------------------------------------------------------------------
# black
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.ruff_cache
  | build
  | dist
  | data
  | models
  | results
)/
'''

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = false   # allow gradual typing
ignore_missing_imports = true   # shap / lightgbm stubs are incomplete
